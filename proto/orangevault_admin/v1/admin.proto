syntax = "proto3";

package orangevault_admin.v1;

// Management API for orangevault. Reads orangevault's D1 directly, gated by
// a macaroon-bearer admin token. NOT exposed to end users — meant for the
// vault operator running ops via a CLI / TUI / internal dashboard.
service AdminService {
  // Liveness probe.
  rpc Healthz(HealthzRequest) returns (HealthzResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // List users in orangevault's `users` table. Paginated.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Get a single user by id.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Rotate a user's security_stamp, invalidating all their outstanding
  // access tokens. orangevault checks sstamp on every authenticated
  // request, so this is the canonical "log this user out everywhere".
  rpc RotateSecurityStamp(RotateSecurityStampRequest) returns (RotateSecurityStampResponse);

  // List every organization on the server.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // List the organizations a user belongs to, with role + status.
  rpc ListUserMemberships(ListUserMembershipsRequest) returns (ListUserMembershipsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message HealthzRequest {}
message HealthzResponse {
  string status = 1;
  string version = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool email_verified = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListUsersRequest {
  optional uint32 limit = 1;   // default 100, max 1000
  optional string cursor = 2;  // opaque, returned by previous response
}
message ListUsersResponse {
  repeated User users = 1;
  optional string next_cursor = 2;
}

message RotateSecurityStampRequest {
  string user_id = 1;
}
message RotateSecurityStampResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  User user = 1;
}

message Organization {
  string id = 1;
  string name = 2;
  string billing_email = 3;
  uint32 member_count = 4;
}

message ListOrganizationsRequest {
  optional uint32 limit = 1;
}
message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

// Role enum matches orangevault's membership.atype: 0=Owner, 1=Admin,
// 2=User, 3=Manager. Status: 0=Invited, 1=Accepted, 2=Confirmed.
message Membership {
  string organization_id = 1;
  string organization_name = 2;
  int32 role = 3;
  int32 status = 4;
}

message ListUserMembershipsRequest {
  string user_id = 1;
}
message ListUserMembershipsResponse {
  repeated Membership memberships = 1;
}
