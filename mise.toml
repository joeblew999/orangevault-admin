[settings]
experimental = true

# orangevault-admin — admin worker for orangevault.
# ConnectRPC + libmacaroon + buffa stack (connyay paradigm).
#
# Fresh-machine spin-up:
#   1. fnox set --global -p keychain CLOUDFLARE_API_TOKEN
#      fnox set --global -p keychain CLOUDFLARE_ACCOUNT_ID
#      fnox set --global -p keychain ORANGEVAULT_ADMIN_DOMAIN
#   2. mise install
#      rustup target add wasm32-unknown-unknown
#   3. mise run dev      (local — wrangler dev)
#      mise run deploy   (production)

[tools]
node              = "lts"
"npm:wrangler"    = "latest"
"github:jdx/fnox" = "1.24"

[tasks."deps:update"]
description = "Refresh Cargo.lock so wasm-bindgen >= 0.2.121 (required by worker-build). Idempotent."
run         = "cargo update"

[tasks.dev]
description = "Run locally via wrangler dev."
depends     = ["deps:update"]
run         = "wrangler dev"

[tasks.deploy]
description = "Build web UI + deploy worker to Cloudflare. Reads CLOUDFLARE_API_TOKEN from fnox."
depends     = ["deps:update", "web:build"]
shell       = "nu -c"
run = '''
$env.CLOUDFLARE_API_TOKEN = (^fnox get CLOUDFLARE_API_TOKEN | str trim)
^wrangler deploy
'''

[tasks.tail]
description = "Tail live Worker logs. Reads CLOUDFLARE_API_TOKEN from fnox."
shell       = "nu -c"
run = '''
$env.CLOUDFLARE_API_TOKEN = (^fnox get CLOUDFLARE_API_TOKEN | str trim)
^wrangler tail
'''

# ── web (React + Vite + buf + ConnectRPC client) ───────────────────────────

[tasks."web:install"]
description = "pnpm install for ./web (idempotent)."
dir         = "{{ config_root }}/web"
run         = "npm install"

[tasks."web:gen"]
description = "Generate TS client from ../proto via buf into ./web/gen."
dir         = "{{ config_root }}/web"
depends     = ["web:install"]
run         = "npx buf generate"

[tasks."web:dev"]
description = "Run the React admin UI locally on http://localhost:5174 (proxies RPCs to wrangler dev on :8787)."
dir         = "{{ config_root }}/web"
depends     = ["web:gen"]
run         = "npm run dev"

[tasks."web:build"]
description = "Build static SPA into ./web/dist (consumed by wrangler [assets])."
dir         = "{{ config_root }}/web"
depends     = ["web:gen"]
run         = "npm run build"
