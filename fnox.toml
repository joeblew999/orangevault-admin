# orangevault-admin — secrets + config resolved from the macOS keychain.
#
# Write a value with:   fnox set --global -p keychain <KEY>
#
# Shared item names ARE the cross-repo contract — renaming a key here
# without updating every consumer breaks auth silently. Coordinate name
# changes across repos.

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
# Cloudflare deploy credentials (shared across every CF Workers repo).
CLOUDFLARE_API_TOKEN     = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
CLOUDFLARE_ACCOUNT_ID    = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }

# Production domain for the admin worker.
ORANGEVAULT_ADMIN_DOMAIN = { provider = "keychain", value = "ORANGEVAULT_ADMIN_DOMAIN" }

# Bearer token used to authenticate every RPC against orangevault-admin.
# Generate + push with:
#   TOKEN=$(openssl rand -base64 32 | tr -d '=' | tr '+/' '-_')
#   echo -n "$TOKEN" | fnox set --global -p keychain ORANGEVAULT_ADMIN_TOKEN
#   echo -n "$TOKEN" | wrangler secret put ADMIN_TOKEN
# Constant-time comparison on the worker side. Future: macaroons via
# libmacaroon — already a Cargo dep, then this key becomes the root key.
ORANGEVAULT_ADMIN_TOKEN  = { provider = "keychain", value = "ORANGEVAULT_ADMIN_TOKEN" }
