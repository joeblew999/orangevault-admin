name = "orangevault-admin"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-22"

[build]
command = "cargo install -q worker-build@^0.8 && worker-build --release"

# Same D1 instance as orangevault — admin worker reads/writes the same
# users / ciphers / etc tables.
[[d1_databases]]
binding = "DB"
database_name = "orangevault"
database_id = "844a51fd-229d-4e2b-8fb1-a4f37bd17c22"

[vars]
# Set via `wrangler secret put MACAROON_ROOT_KEY` after generating with
# `openssl rand -base64 32`. Until then macaroon verification falls back
# to a deterministic dev key — fine for first deploy, MUST be rotated
# before any real use.
MACAROON_ROOT_KEY = ""
