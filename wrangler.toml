name = "orangevault-admin"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-22"

[build]
command = "cargo install -q worker-build@^0.8 && worker-build --release"

# Same D1 instance as orangevault — admin worker reads/writes the same
# users / ciphers / etc tables.
[[d1_databases]]
binding = "DB"
database_name = "orangevault"
database_id = "844a51fd-229d-4e2b-8fb1-a4f37bd17c22"

[vars]
# Bearer auth gate. Set the real value via:
#   wrangler secret put ADMIN_TOKEN
# Anything reaching this worker (other than GET /healthz) needs:
#   Authorization: Bearer <ADMIN_TOKEN>
# Token comparison is constant-time. Future: macaroons via libmacaroon
# (already a Cargo dep) — same root key field repurposed at that point.
MACAROON_ROOT_KEY = ""
